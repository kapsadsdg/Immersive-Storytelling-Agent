[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "immersive-storytelling-agent"
version = "0.2.0"
description = "An agentic interactive-fiction engine: type a theme, then play the story with eight on-demand LLM agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zhongrui Nie" }]
requires-python = ">=3.10"
keywords = ["interactive fiction", "llm", "agents", "storytelling", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "anthropic>=1.13.0",
    "openai>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "httpx2",  # used directly by the provider-adapter tests; also installed by the SDKs
    "pyflakes>=3.0",
]

[project.scripts]
story-agent = "story_agent.cli:main"
story-agent-web = "story_agent.web.app:main"

[tool.setuptools.packages.find]
include = ["story_agent*"]

[tool.setuptools.package-data]
story_agent = ["web/static/*.html", "web/static/audio/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
