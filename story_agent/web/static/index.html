<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immersive Storyteller</title>
<style>
  :root {
    --bg: #f6f2ea; --panel: #fffdf8; --ink: #2a2622; --muted: #7a7065; --line: #e2d9cb;
    --accent: #8a4b2a; --accent-soft: #f1e3d6; --story: #1f1b17;
    --world_architect: #8e44ad; --plot_planner: #6c3fb5; --intent_interpreter: #1f7a8c; --scene_director: #17607a;
    --character_agent: #b4531f; --narrator: #3a7d44; --narrative_critic: #b3261e; --chronicler: #b07d12; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15130f; --panel: #1d1a16; --ink: #e9e2d6; --muted: #9a9083; --line: #332e27;
      --accent: #e0a070; --accent-soft: #3a2a1f; --story: #f1ebe0;
      --world_architect: #c38ad6; --plot_planner: #a993e8; --intent_interpreter: #6cc3d3; --scene_director: #5fa8d6;
      --character_agent: #f0a06a; --narrator: #85c78e; --narrative_critic: #f2827a; --chronicler: #e2b54a; --danger: #f2827a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
  header .spacer { flex: 1; }
  #btn-sound { font-size: 12px; padding: 2px 10px; border-radius: 99px; color: var(--muted); }
  #btn-sound[aria-pressed="true"] { color: var(--ink); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); padding: 7px 14px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
  .hidden { display: none !important; }
  #offline { margin: 12px 20px 0; padding: 10px 14px; border: 1px solid var(--danger); border-radius: 10px;
             background: var(--accent-soft); font-size: 14px; }
  #offline b { color: var(--danger); }
  #offline code { font-size: 13px; }

  /* start screen */
  #start { max-width: 720px; margin: 7vh auto; padding: 0 16px; }
  #start h2 { font: 600 30px/1.2 Georgia, "Songti SC", serif; margin: 0 0 8px; }
  #start p { color: var(--muted); margin: 0 0 20px; }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--panel);
           border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
  .chip { font-size: 13px; padding: 5px 12px; border-radius: 99px; }
  #saved { margin-top: 36px; }
  #saved h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .saved-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .saved-item { display: flex; justify-content: space-between; gap: 12px; flex: 1; min-width: 0; text-align: left; }
  .saved-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-item span:last-child { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .saved-delete { flex: none; font-size: 13px; color: var(--muted); }
  .saved-delete:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }

  /* story screen */
  #play { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100vh - 53px); }
  #main { display: flex; flex-direction: column; min-width: 0; }
  #scroll { flex: 1; overflow-y: auto; padding: 28px 16px 12px; }
  #storytext { max-width: 680px; margin: 0 auto; }
  .story-title { font: 600 26px/1.25 Georgia, "Songti SC", serif; margin: 0 0 4px; }
  .logline { color: var(--muted); font-style: italic; margin: 0 0 28px; }
  .segment { font: 18px/1.75 Georgia, "Songti SC", "SimSun", serif; color: var(--story); white-space: pre-wrap; margin: 0 0 22px; }
  .segment.revision { border-left: 3px solid var(--accent); padding-left: 14px; }
  /* Key moments: bold with a soft highlighter stroke in the accent colour. */
  .segment strong { font-weight: 700; color: var(--story); text-decoration: underline; text-decoration-color: var(--accent-soft);
                    text-decoration-thickness: .4em; text-underline-offset: -.18em; text-decoration-skip-ink: none; }
  .you { color: var(--accent); font-size: 14px; margin: 0 0 18px; }
  .you::before { content: "\25B8  "; }
  .question { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin: 0 0 22px; }
  .question b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .note { color: var(--muted); font-size: 13px; margin: -10px 0 18px; }
  .the-end { text-align: center; font: italic 20px Georgia, serif; color: var(--accent); margin: 30px 0; }
  #status { min-height: 26px; max-width: 680px; margin: 0 auto; padding: 0 16px; font-size: 13px; color: var(--muted); }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  #composer > div { max-width: 680px; margin: 0 auto; }
  #choices { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #choices button { text-align: left; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .tools { display: flex; gap: 8px; margin-top: 8px; }
  .tools button { font-size: 12px; padding: 4px 10px; color: var(--muted); }

  /* side panel */
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .tabs button.active { color: var(--ink); box-shadow: inset 0 -2px var(--accent); }
  #tab-body { overflow-y: auto; padding: 16px; font-size: 14px; }
  #tab-body h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #tab-body h4:first-child { margin-top: 0; }
  #tab-body ul { margin: 0; padding-left: 18px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .card .role { font-size: 12px; color: var(--muted); }
  .steps { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .step { display: flex; gap: 8px; font-size: 13px; padding: 2px 0; }
  .step .mark { width: 14px; flex: none; text-align: center; }
  .step.skipped { opacity: .55; }
  .secret { color: var(--accent); font-size: 13px; }
  .beat { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .beat .mark { width: 20px; flex: none; text-align: center; }
  .beat.done { color: var(--muted); }
  .beat.active { font-weight: 600; }
  .meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .meter > div { height: 100%; background: var(--accent); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); margin-right: 6px; }
  .tag.critical { border-color: var(--accent); color: var(--accent); }
  .lock { font-size: 12px; color: var(--muted); }
  pre.pacing { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); }

  @media (max-width: 860px) {
    #play { grid-template-columns: 1fr; height: auto; }
    #scroll { max-height: none; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Immersive Storyteller</h1>
  <span class="badge" id="model">...</span>
  <button id="btn-sound" class="hidden" type="button" aria-pressed="true">Sound on</button>
  <span class="spacer"></span>
  <button id="btn-new" class="hidden">New story</button>
</header>
<div id="offline" class="hidden" role="alert"></div>

<section id="start">
  <h2>What story shall we tell?</h2>
  <p>Describe a theme, a mood, a world or a single image. The agent builds the world, its people and the shape of the plot. Then you decide what happens.</p>
  <textarea id="theme" rows="3" placeholder="e.g. A lighthouse keeper on a planet where the sea is made of glass"></textarea>
  <div class="chips" id="examples"></div>
  <button class="primary" id="btn-begin">Begin the story</button>
  <div id="saved" class="hidden"><h3>Continue a story</h3><div id="saved-list"></div></div>
</section>

<section id="play" class="hidden">
  <div id="main">
    <div id="scroll"><div id="storytext"></div></div>
    <div id="status"></div>
    <div id="composer"><div>
      <div id="choices"></div>
      <form class="row" id="form">
        <input type="text" id="input" autocomplete="off" placeholder="What do you do or say?">
        <button class="primary" id="btn-send">Send</button>
      </form>
      <div class="tools">
        <button type="button" data-fill="Rewrite the last scene so that ">Revise last scene</button>
        <button type="button" data-fill="From now on, I want the plot to ">Change the plot</button>
        <button type="button" data-send="I want the story to end now. Please conclude it.">End the story</button>
      </div>
    </div></div>
  </div>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div id="tab-body"></div>
  </aside>
</section>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AGENTS = {
  world_architect: "World Architect", plot_planner: "Plot Planner", intent_interpreter: "Intent Interpreter",
  scene_director: "Scene Director", character_agent: "Character Agent", narrator: "Narrator",
  narrative_critic: "Narrative Critic", chronicler: "Chronicler",
};
const EXAMPLES = [
  "A heist in a city where memories are currency",
  "Gemütlicher Krimi in einem Teehaus in den Bergen während eines Schneesturms",
  "The last astronaut on a generation ship",
  "Das Krokodil baby sucht seine Mama.",
];
let story = null, busy = false, tab = "world", showSecrets = false, live = null, liveRaw = "";

// Story prose is plain text with **bold** key moments. Escape first, then add <strong>,
// so story text can never inject HTML.
function formatProse(text, streaming = false) {
  let html = esc(text).replace(/\*\*(?=[^\s*])([^*\n]+?)(?<=[^\s*])\*\*/g, "<strong>$1</strong>");
  if (streaming) {
    // A ** that has opened but not yet closed shows as bold to the end, never as raw asterisks.
    const open = html.lastIndexOf("**");
    if (open !== -1) html = html.slice(0, open) + "<strong>" + html.slice(open + 2) + "</strong>";
    if (html.endsWith("*")) html = html.slice(0, -1);  // first half of a marker still arriving
  }
  return html.replace(/\*\*/g, "");
}

// ---------------------------------------------------------------- networking
async function streamPost(url, body, onEvent) {
  const res = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || res.statusText); }
  const reader = res.body.getReader(), decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (line) onEvent(JSON.parse(line));
    }
  }
}

function handleEvent(ev) {
  if (ev.type === "status") setStatus(ev.agent, ev.message, ev.label);
  else if (ev.type === "story") { $("#storytext").innerHTML = `<h2 class="story-title">${esc(ev.title)}</h2>`; }
  else if (ev.type === "decision") {
    const note = ev.policy_note ? ` (${ev.policy_note})` : "";
    setStatus("intent_interpreter", `${ev.action.toUpperCase()}: ${ev.rationale}${note}`, "Decision");
  }
  else if (ev.type === "delta") {
    if (!live) { live = document.createElement("div"); live.className = "segment"; liveRaw = ""; $("#storytext").appendChild(live); }
    liveRaw += ev.text; live.innerHTML = formatProse(liveRaw, true); scrollDown();
  }
  else if (ev.type === "reset") { liveRaw = ""; if (live) live.innerHTML = ""; }
  else if (ev.type === "done") { story = ev.story; live = null; renderAll(ev.result); }
  else if (ev.type === "error") { live = null; throw new Error(ev.message); }
}

async function run(url, body) {
  busy = true; updateComposer();
  sound.startMusic(story?.state?.tension ?? 1);  // a new story starts in the calm band
  try { await streamPost(url, body, handleEvent); $("#status").innerHTML = ""; }
  catch (e) { setStatus("", "Something went wrong: " + e.message + ". You can try again."); if (story) { renderStory(); renderChoices(); } }
  finally { busy = false; live = null; updateComposer(); sound.stopMusic(); }
}

// ---------------------------------------------------------------- sound (optional, user-supplied files)
// The server lists only the files that exist in static/audio, so missing files are never requested.
// Every failure here is silent: sound is decoration and must never break a turn.
const sound = {
  manifest: null, enabled: true, music: null, current: "", clickBase: null, fadeTimer: null, wanted: false,
  MUSIC_VOLUME: 0.35, CLICK_VOLUME: 0.5,

  async init() {
    try { this.enabled = localStorage.getItem("sound") !== "off"; } catch (e) { /* storage blocked */ }
    try { this.manifest = await (await fetch("/api/audio")).json(); } catch (e) { this.manifest = null; }
    const m = this.manifest;
    const any = !!m && (!!m.click || Object.values(m.thinking || {}).some(Boolean));
    if (m?.click) { this.clickBase = new Audio(m.click); this.clickBase.preload = "auto"; }
    $("#btn-sound").classList.toggle("hidden", !any);
    this.renderToggle();
  },
  renderToggle() {
    const b = $("#btn-sound");
    b.textContent = this.enabled ? "Sound on" : "Sound off";
    b.setAttribute("aria-pressed", String(this.enabled));
  },
  toggle() {
    this.enabled = !this.enabled;
    try { localStorage.setItem("sound", this.enabled ? "on" : "off"); } catch (e) { /* storage blocked */ }
    if (!this.enabled) this.stopMusic(true);
    else if (busy) this.startMusic(story?.state?.tension ?? 1);
    this.renderToggle();
  },
  trackFor(tension) {
    const t = this.manifest?.thinking || {};
    const band = tension >= 8 ? "climax" : tension >= 4 ? "tense" : "calm";
    return t[band] || t.default || null;
  },
  fade(target, ms, onDone) {
    clearInterval(this.fadeTimer);
    const a = this.music, start = a.volume, steps = Math.max(1, Math.round(ms / 50));
    let i = 0;
    this.fadeTimer = setInterval(() => {
      i++;
      a.volume = Math.min(1, Math.max(0, start + (target - start) * (i / steps)));
      if (i >= steps) { clearInterval(this.fadeTimer); if (onDone) onDone(); }
    }, 50);
  },
  startMusic(tension) {
    if (!this.enabled) return;
    const src = this.trackFor(tension);
    if (!src) return;
    if (!this.music) { this.music = new Audio(); this.music.loop = true; }
    clearInterval(this.fadeTimer);
    this.wanted = true;
    if (this.current !== src) { this.music.src = src; this.current = src; }
    this.music.volume = 0;
    this.music.play().then(() => {
      if (this.wanted) this.fade(this.MUSIC_VOLUME, 600);
      else this.music.pause();  // the turn finished before playback began
    }).catch(() => { /* blocked or unplayable */ });
  },
  stopMusic(immediate = false) {
    this.wanted = false;
    if (!this.music || this.music.paused) return;
    if (immediate) { clearInterval(this.fadeTimer); this.music.pause(); return; }
    this.fade(0, 600, () => this.music.pause());
  },
  click() {
    if (!this.enabled || !this.clickBase) return;
    const a = this.clickBase.cloneNode();  // a fresh node lets quick clicks overlap
    a.volume = this.CLICK_VOLUME;
    a.play().catch(() => { /* blocked or unplayable */ });
  },
};

// ---------------------------------------------------------------- rendering
function setStatus(agent, msg, label) {
  const color = agent ? `var(--${agent})` : "var(--muted)";
  $("#status").innerHTML = `<span class="dot" style="background:${color}"></span><b style="color:${color}">${esc(label || AGENTS[agent] || "")}</b> ${esc(msg)}`;
}
function scrollDown() { const s = $("#scroll"); s.scrollTop = s.scrollHeight; window.scrollTo(0, document.body.scrollHeight); }

function renderStory(result) {
  const w = story.world;
  let html = `<h2 class="story-title">${esc(w.title)}</h2><p class="logline">${esc(w.logline)}</p>`;
  for (const seg of story.segments) {
    if (seg.user_input) html += `<p class="you">${esc(seg.user_input)}</p>`;
    html += `<div class="segment ${seg.kind === "revision" ? "revision" : ""}">${formatProse(seg.text)}</div>`;
  }
  if (story.status === "awaiting_clarification" && story.pending_question) {
    const last = story.decisions[story.decisions.length - 1];
    if (last) html += `<p class="you">${esc(last.user_input)}</p>`;
    html += `<div class="question"><b>The storyteller asks</b>${esc(story.pending_question)}</div>`;
  }
  for (const n of (result?.notes || [])) html += `<p class="note">${esc(n)}</p>`;
  if (story.status === "concluded") html += `<p class="the-end">The End</p>`;
  $("#storytext").innerHTML = html;
  scrollDown();
}

function renderChoices() {
  const box = $("#choices"); box.innerHTML = "";
  if (story.status === "concluded") return;
  story.choices.forEach((c, i) => {
    const b = document.createElement("button"); b.type = "button";
    b.textContent = `${i + 1}. ${c}`; b.onclick = () => send(c); box.appendChild(b);
  });
}

function updateComposer() {
  const ended = story?.status === "concluded";
  document.querySelectorAll("#composer button, #input").forEach((el) => el.disabled = busy || ended);
  $("#input").placeholder = ended ? "This story has ended. Start a new one from the top bar." : "What do you do or say?";
}

const TABS = {
  world() {
    const w = story.world;
    return `<p class="lock">Fixed world settings: set from your theme, never changed.</p>
      <h4>Genre and tone</h4><p>${esc(w.genre)}. ${esc(w.tone)}.</p>
      <h4>Setting</h4><p>${esc(w.setting)}</p>
      <h4>World rules</h4><ul>${w.world_rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
      <h4>Places</h4>${w.locations.map((l) => `<div class="card"><b>${esc(l.name)}</b><br>${esc(l.description)}</div>`).join("")}
      <h4>Themes</h4><p>${w.themes.map(esc).join(", ")}</p>
      <h4>Voice</h4><p>${esc(w.narrative_style)}</p>
      <h4>Pacing plan</h4><p>${esc(story.pacing.style)} About ${story.pacing.target_turns} turns.</p>`;
  },
  cast() {
    const card = (c, you) => `<div class="card"><b>${esc(c.name)}</b> <span class="role">${you ? "you" : esc(c.role)}</span>
      <br>${esc(c.description)}<br><i>Wants:</i> ${esc(c.motivation)}
      ${showSecrets && c.secret ? `<div class="secret">Secret: ${esc(c.secret)}</div>` : ""}</div>`;
    return `<label class="lock"><input type="checkbox" id="secrets" ${showSecrets ? "checked" : ""}> Show secrets (spoilers)</label><br><br>`
      + card(story.protagonist, true) + story.characters.map((c) => card(c, false)).join("");
  },
  state() {
    const s = story.state;
    return `<h4>Turn ${s.turn}</h4><p><b>${esc(s.location)}</b>, ${esc(s.time)}</p>
      <h4>Now</h4><p>${esc(s.situation)}</p>
      <h4>Tension ${s.tension}/10</h4><div class="meter"><div style="width:${s.tension * 10}%"></div></div>
      <h4>You</h4><p>${esc(s.protagonist_condition)}</p>
      <h4>Inventory</h4><p>${s.inventory.map(esc).join(", ") || "Nothing"}</p>
      <h4>Present</h4><p>${s.present_characters.map(esc).join(", ") || "No one else"}</p>
      <h4>Characters</h4>${s.characters.map((c) => `<div class="card"><b>${esc(c.name)}</b>: ${esc(c.status)}<br><span class="role">Toward you: ${esc(c.disposition)}</span></div>`).join("")}
      <h4>Open threads</h4><ul>${s.open_threads.map((t) => `<li>${esc(t)}</li>`).join("") || "<li>None</li>"}</ul>
      <h4>Story so far</h4><p>${esc(s.summary) || "Just beginning."}</p>`;
  },
  outline() {
    const mark = {done: "&#10003;", active: "&#9656;", pending: "&#9675;"};
    return `<p class="lock">Adjustable: ask to change the plot and future beats are rewritten. Completed beats stay.</p>`
      + story.outline.beats.map((b) => `<div class="beat ${b.status}"><span class="mark">${mark[b.status]}</span>
        <div><div>Act ${b.act}: ${esc(b.title)}</div><div class="role">${esc(b.description)} (tension ${b.tension_target})</div></div></div>`).join("")
      + (story.outline.revision_log.length ? `<h4>Revisions</h4><ul>${story.outline.revision_log.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` : "")
      + `<h4>Pacing</h4><pre class="pacing">${esc(story.pacing_report)}</pre>`;
  },
  events() {
    if (!story.events.length) return "<p>No key events yet.</p>";
    return story.events.slice().reverse().map((e) => `<div class="card"><span class="tag ${e.significance}">${e.significance}</span>
      <span class="role">turn ${e.turn}</span><br>${esc(e.description)}<br><span class="role">${esc(e.consequences)}</span></div>`).join("");
  },
  agents() {
    if (!story.decisions.length) return "<p>No turns yet.</p>";
    const steps = (d) => {
      // One line per agent: the first time it ran this turn, or why it was skipped.
      const seen = new Map();
      for (const s of d.trace || []) { if (!seen.has(s.agent) || (s.ran && !seen.get(s.agent).ran)) seen.set(s.agent, s); }
      return [...seen.values()].sort((a, b) => b.ran - a.ran).map((s) => `<div class="step ${s.ran ? "ran" : "skipped"}">
        <span class="mark" style="color:var(--${s.agent})">${s.ran ? "&#9679;" : "&#9675;"}</span>
        <div><b>${esc(AGENTS[s.agent] || s.agent)}</b> <span class="role">${esc(s.reason)}</span></div></div>`).join("");
    };
    return `<p class="lock">Eight agents run on demand. Each turn the Scheduler decides which are needed, and the Policy Guard checks the decision.</p>`
      + story.decisions.slice().reverse().map((d) => `<div class="card"><span class="tag">${d.action}${d.action === "revise" ? "/" + d.revision_scope : ""}</span>
      <span class="role">turn ${d.turn}</span><br><i>${esc(d.user_input)}</i><br>${esc(d.rationale)}
      ${d.overridden_by_policy ? `<div class="role">Policy: ${esc(d.overridden_by_policy)}</div>` : ""}
      ${(d.trace || []).length ? `<div class="steps">${steps(d)}</div>` : ""}</div>`).join("");
  },
};

function renderTabs() {
  $("#tabs").innerHTML = Object.keys(TABS).map((t) => `<button data-tab="${t}" class="${t === tab ? "active" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
  $("#tab-body").innerHTML = TABS[tab]();
  const sec = $("#secrets"); if (sec) sec.onchange = () => { showSecrets = sec.checked; renderTabs(); };
}

function renderAll(result) {
  $("#start").classList.add("hidden"); $("#play").classList.remove("hidden"); $("#btn-new").classList.remove("hidden");
  renderStory(result); renderChoices(); renderTabs(); updateComposer();
  history.replaceState(null, "", "#" + story.id);
}

// ---------------------------------------------------------------- actions
function send(text) {
  text = text.trim();
  if (!text || busy || !story) return;
  $("#input").value = "";
  $("#choices").innerHTML = "";
  const p = document.createElement("p"); p.className = "you"; p.textContent = text; $("#storytext").appendChild(p);
  scrollDown();
  run(`/api/stories/${story.id}/turns`, {input: text});
}

async function begin() {
  const theme = $("#theme").value.trim();
  if (!theme || busy) return;
  $("#start").classList.add("hidden"); $("#play").classList.remove("hidden");
  $("#storytext").innerHTML = ""; $("#choices").innerHTML = ""; $("#tab-body").innerHTML = "<p>The world is being built...</p>";
  story = null;
  await run("/api/stories", {theme});
  if (!story) { $("#play").classList.add("hidden"); $("#start").classList.remove("hidden"); alert("Could not start the story. Check the server log."); }
}

async function load(id) {
  const res = await fetch(`/api/stories/${id}`);
  if (!res.ok) return false;
  story = await res.json(); renderAll(); return true;
}

async function showStart() {
  story = null; history.replaceState(null, "", "#");
  $("#play").classList.add("hidden"); $("#start").classList.remove("hidden"); $("#btn-new").classList.add("hidden");
  const saves = await (await fetch("/api/stories")).json();
  $("#saved").classList.toggle("hidden", !saves.length);
  $("#saved-list").innerHTML = saves.slice(0, 8).map((s) => `<div class="saved-row">
    <button class="saved-item" data-id="${esc(s.id)}">
      <span>${esc(s.title)}</span><span>${s.status === "concluded" ? "finished" : "turn " + s.turn}</span></button>
    <button class="saved-delete" data-delete="${esc(s.id)}" data-title="${esc(s.title)}" aria-label="Delete ${esc(s.title)}">Delete</button>
  </div>`).join("");
}

async function deleteStory(id, title) {
  if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
  const res = await fetch(`/api/stories/${id}`, {method: "DELETE"});
  if (!res.ok && res.status !== 404) {
    const err = await res.json().catch(() => ({}));
    alert(err.detail || "Could not delete the story.");
  }
  showStart();
}

$("#examples").innerHTML = EXAMPLES.map((e) => `<button class="chip" type="button">${esc(e)}</button>`).join("");
$("#examples").onclick = (e) => { if (e.target.matches(".chip")) $("#theme").value = e.target.textContent; };
$("#saved-list").onclick = (e) => {
  const del = e.target.closest("[data-delete]");
  if (del) { deleteStory(del.dataset.delete, del.dataset.title); return; }
  const b = e.target.closest("[data-id]"); if (b) load(b.dataset.id);
};
$("#btn-begin").onclick = begin;
$("#theme").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); begin(); } };
$("#btn-new").onclick = showStart;
$("#btn-sound").onclick = () => sound.toggle();
// Capture phase, so the click sound starts before handlers that may block (e.g. a confirm dialog).
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b && !b.disabled) sound.click();
}, true);
sound.init();
$("#form").onsubmit = (e) => { e.preventDefault(); send($("#input").value); };
$("#tabs").onclick = (e) => { const b = e.target.closest("[data-tab]"); if (b) { tab = b.dataset.tab; renderTabs(); } };
document.querySelectorAll(".tools button").forEach((b) => b.onclick = () => {
  if (b.dataset.send) send(b.dataset.send);
  else { $("#input").value = b.dataset.fill; $("#input").focus(); }
});

// The page only works when the storyteller's server delivers it: stories, the model name and sound
// all come from the server. Opened as a plain file, or with the server stopped, explain how to fix it.
function showOffline(openedAsFile) {
  const b = $("#offline");
  b.innerHTML = openedAsFile
    ? `<b>Open this page through the server.</b> This file was opened directly, so your stories, the model name and sound cannot load.
       Start the server with <code>start.bat</code> or <code>python -m story_agent.web</code>, then go to
       <a href="http://127.0.0.1:8000">http://127.0.0.1:8000</a>.`
    : `<b>Cannot reach the storyteller server.</b> Start it with <code>start.bat</code> or
       <code>python -m story_agent.web</code>, then reload this page.`;
  b.classList.remove("hidden");
}
const servedByServer = location.protocol === "http:" || location.protocol === "https:";
if (!servedByServer) showOffline(true);

fetch("/api/config").then((r) => r.json()).then((c) => {
  $("#model").textContent = c.provider === "mock" ? "offline mock (no API key)" : `${c.provider} · ${c.model}`;
}).catch(() => { if (servedByServer) showOffline(false); });
(async () => {
  try { const id = location.hash.slice(1); if (!(id && await load(id))) await showStart(); }
  catch (e) { showOffline(!servedByServer); }
})();
</script>
</body>
</html>
